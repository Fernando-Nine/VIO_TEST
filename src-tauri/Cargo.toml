[package]
name = "vio-desktop"
version = "0.0.0"
description = "VIO para Windows"
authors = ["NerdQuest Studios"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Approved 2026-10-27 (#192): SharedBuffer for native screen frames. Same version Tauri uses.
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# Unwind (#246): a panic in a capture thread ends that capture, not the app.
panic = "unwind"
