name: VIO Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src-tauri/**, src/client/**, src/shared/**, scripts/build-desktop.mjs, package.json, package-lock.json, .github/workflows/windows.yml]
  pull_request:
    paths: [src-tauri/**, src/client/**, src/shared/**, scripts/build-desktop.mjs, package.json, package-lock.json, .github/workflows/windows.yml]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Produces dist/source.tar.gz, shipped inside the installer (AGPL).
      - run: npm run build
      - run: npm run build:desktop
      - name: Native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build NSIS installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Update signatures only when the key secret exists (never on forks).
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --bundles nsis --config src-tauri/tauri.updater.json -- --locked
          } else {
            npx tauri build --bundles nsis -- --locked
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: VIO-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
