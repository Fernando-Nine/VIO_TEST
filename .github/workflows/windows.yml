name: VIO Windows

on:
  workflow_dispatch:
  push:
    branches: [main, feat/windows-wasapi]
    paths:
      [
        src/**,
        src-tauri/**,
        scripts/**,
        tests/**,
        package.json,
        package-lock.json,
        .github/workflows/windows.yml,
      ]
  pull_request:
    paths:
      [
        src/**,
        src-tauri/**,
        scripts/**,
        tests/**,
        package.json,
        package-lock.json,
        .github/workflows/windows.yml,
      ]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Install locked web dependencies
        run: npm ci
      - name: Type and protocol checks
        run: |
          npm run typecheck
          npm test
          npm run build:desktop
      - name: Native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows x64 installer
        run: npx --yes @tauri-apps/cli@2.12.0 build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Installer checksum
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | ForEach-Object {
            $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$digest  $($_.Name)" | Set-Content -Encoding utf8 "$($_.FullName).sha256"
          }
      - name: Save installer and corresponding source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VIO-Windows-x64-beta
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            dist/source.tar.gz
            docs/WINDOWS.md
