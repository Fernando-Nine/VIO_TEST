name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Raise to --audit-level=high once #83 is fixed.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      # build regenerates CHANGELOG.md from releases.ts; a diff means it was not committed.
      - run: git diff --exit-code -- CHANGELOG.md
